  <path d="M18 37 Q26 31 34 37 Q42 31 50 37 Q58 31 66 37 Q72 39 78 37 L78 43 Q72 41 66 43 Q58 37 50 43 Q42 37 34 43 Q26 37 18 43 Z" fill="#43A047"/>
