  <line x1="39" y1="51" x2="37" y2="60" stroke="#3A1204" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="51" x2="49" y2="60" stroke="#3A1204" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="51" x2="61" y2="60" stroke="#3A1204" stroke-width="2" stroke-linecap="round"/>

