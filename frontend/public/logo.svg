  <!-- ══ TEXT ══ -->

  <!-- HAMBURGER -->
  <text x="104" y="46"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="28"
    letter-spacing="0.5"
    fill="#1A1A1A">HAMBURGER</text>

  <!-- KING pill -->
  <rect x="102" y="52" width="116" height="34" rx="6" fill="#D62300"/>
